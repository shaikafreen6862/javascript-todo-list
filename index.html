<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | To-Do List</title>

    <style>
        /* =========================
           CSS VARIABLES
        ========================== */
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f4f7fb;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           RESET
        ========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================== */
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1000px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* =========================
           MAIN CONTAINER
        ========================== */
        main {
            width: min(100% - 30px, 1000px);
            margin: 40px auto;
        }

        /* =========================
           TODO CARD
        ========================== */
        .todo-card {
            background: var(--card);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .todo-card h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        /* =========================
           ADD TASK FORM
        ========================== */
        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .task-input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }

        .task-input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: var(--primary-dark);
        }

        /* =========================
           FILTERS
        ========================== */
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .filter-btn {
            padding: 9px 18px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            border-radius: 20px;
            transition: 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* =========================
           TASK STATISTICS
        ========================== */
        .task-stats {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* =========================
           TASK LIST
        ========================== */
        .task-list {
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 15px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: white;

            transition: 0.2s;
        }

        .task-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
        }

        /* Checkbox */
        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        /* Task text */
        .task-text {
            flex: 1;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--muted);
        }

        /* Buttons */
        .task-actions {
            display: flex;
            gap: 7px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .delete-btn {
            background: var(--danger);
        }

        .edit-btn:hover {
            opacity: 0.85;
        }

        .delete-btn:hover {
            opacity: 0.85;
        }

        /* =========================
           EMPTY STATE
        ========================== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: var(--text);
        }

        /* =========================
           FOOTER
        ========================== */
        footer {
            text-align: center;
            padding: 25px;
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================== */

        @media (max-width: 600px) {

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .todo-card {
                padding: 18px;
            }

            .todo-card h1 {
                font-size: 24px;
            }

            .task-form {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .task-item {
                align-items: flex-start;
            }

            .task-actions {
                flex-direction: column;
            }

            .edit-btn,
            .delete-btn {
                padding: 7px 10px;
            }

            .task-stats {
                flex-direction: column;
                gap: 5px;
            }
        }

        @media (min-width: 768px) {
            .todo-card {
                padding: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <div class="header-content">
            <div>
                <div class="logo">TaskFlow</div>
                <div class="subtitle">
                    JavaScript Logic & State Management
                </div>
            </div>

            <div>
                <strong id="headerCount">0 Tasks</strong>
            </div>
        </div>
    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main>

        <section class="todo-card">

            <h1>My To-Do List</h1>


            <!-- ADD TASK FORM -->
            <form class="task-form" id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    class="task-input"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                    required
                >

                <button type="submit" class="add-btn">
                    + Add Task
                </button>

            </form>


            <!-- FILTER BUTTONS -->
            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- STATISTICS -->
            <div class="task-stats">

                <span id="totalTasks">
                    Total: 0
                </span>

                <span id="completedTasks">
                    Completed: 0
                </span>

                <span id="activeTasks">
                    Active: 0
                </span>

            </div>


            <!-- TASK LIST -->
            <ul
                class="task-list"
                id="taskList">
            </ul>


            <!-- EMPTY MESSAGE -->
            <div
                class="empty-state"
                id="emptyState">

                <h2>No tasks yet</h2>

                <p>
                    Add your first task to get started!
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer>
        <p>
            TaskFlow &copy;
            <span id="year"></span>
            | JavaScript Task Management
        </p>
    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script>

        /* =========================================
           APPLICATION STATE
        ========================================== */

        let tasks = JSON.parse(
            localStorage.getItem("taskFlowTasks")
        ) || [];

        let currentFilter = "all";

        let editingTaskId = null;


        /* =========================================
           DOM ELEMENTS
        ========================================== */

        const taskForm =
            document.getElementById("taskForm");

        const taskInput =
            document.getElementById("taskInput");

        const taskList =
            document.getElementById("taskList");

        const emptyState =
            document.getElementById("emptyState");

        const totalTasks =
            document.getElementById("totalTasks");

        const completedTasks =
            document.getElementById("completedTasks");

        const activeTasks =
            document.getElementById("activeTasks");

        const headerCount =
            document.getElementById("headerCount");

        const filterButtons =
            document.querySelectorAll(".filter-btn");

        const year =
            document.getElementById("year");


        /* =========================================
           SAVE DATA TO LOCAL STORAGE
        ========================================== */

        function saveTasks() {

            localStorage.setItem(
                "taskFlowTasks",
                JSON.stringify(tasks)
            );

        }


        /* =========================================
           CREATE UNIQUE ID
        ========================================== */

        function generateId() {

            return Date.now().toString() +
                   Math.random().toString(16).slice(2);

        }


        /* =========================================
           ADD TASK
        ========================================== */

        taskForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const text =
                    taskInput.value.trim();

                if (text === "") {
                    return;
                }


                /* UPDATE EXISTING TASK */

                if (editingTaskId !== null) {

                    tasks = tasks.map(function(task) {

                        if (
                            task.id === editingTaskId
                        ) {

                            return {
                                ...task,
                                text: text
                            };

                        }

                        return task;

                    });

                    editingTaskId = null;

                    document.querySelector(
                        ".add-btn"
                    ).textContent = "+ Add Task";

                }

                /* CREATE NEW TASK */

                else {

                    const newTask = {

                        id: generateId(),

                        text: text,

                        completed: false

                    };

                    tasks.push(newTask);

                }


                taskInput.value = "";

                saveTasks();

                renderTasks();

            }
        );


        /* =========================================
           RENDER TASKS
        ========================================== */

        function renderTasks() {

            taskList.innerHTML = "";


            /* FILTER TASKS */

            let filteredTasks =
                tasks.filter(function(task) {

                    if (currentFilter === "active") {

                        return !task.completed;

                    }

                    if (currentFilter === "completed") {

                        return task.completed;

                    }

                    return true;

                });


            /* EMPTY STATE */

            if (filteredTasks.length === 0) {

                emptyState.style.display = "block";

            }

            else {

                emptyState.style.display = "none";

            }


            /* CREATE DOM ELEMENTS */

            filteredTasks.forEach(function(task) {

                const li =
                    document.createElement("li");

                li.className = "task-item";

                if (task.completed) {

                    li.classList.add("completed");

                }


                /* CHECKBOX */

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.className =
                    "task-checkbox";

                checkbox.checked =
                    task.completed;

                checkbox.dataset.id =
                    task.id;


                /* TASK TEXT */

                const span =
                    document.createElement("span");

                span.className =
                    "task-text";

                span.textContent =
                    task.text;


                /* ACTION BUTTONS */

                const actions =
                    document.createElement("div");

                actions.className =
                    "task-actions";


                const editButton =
                    document.createElement("button");

                editButton.className =
                    "edit-btn";

                editButton.textContent =
                    "Edit";

                editButton.dataset.action =
                    "edit";

                editButton.dataset.id =
                    task.id;


                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-btn";

                deleteButton.textContent =
                    "Delete";

                deleteButton.dataset.action =
                    "delete";

                deleteButton.dataset.id =
                    task.id;


                actions.appendChild(editButton);

                actions.appendChild(deleteButton);


                li.appendChild(checkbox);

                li.appendChild(span);

                li.appendChild(actions);


                taskList.appendChild(li);

            });


            updateStatistics();

        }


        /* =========================================
           EVENT DELEGATION
        ========================================== */

        taskList.addEventListener(
            "click",
            function(event) {

                const button =
                    event.target.closest("button");

                if (!button) {
                    return;
                }

                const id =
                    button.dataset.id;

                const action =
                    button.dataset.action;


                if (action === "edit") {

                    editTask(id);

                }

                if (action === "delete") {

                    deleteTask(id);

                }

            }
        );


        /* =========================================
           COMPLETE / UNCOMPLETE TASK
        ========================================== */

        taskList.addEventListener(
            "change",
            function(event) {

                if (
                    !event.target.classList.contains(
                        "task-checkbox"
                    )
                ) {

                    return;

                }


                const id =
                    event.target.dataset.id;


                tasks = tasks.map(function(task) {

                    if (task.id === id) {

                        return {
                            ...task,
                            completed:
                                event.target.checked
                        };

                    }

                    return task;

                });


                saveTasks();

                renderTasks();

            }
        );


        /* =========================================
           EDIT TASK
        ========================================== */

        function editTask(id) {

            const task =
                tasks.find(function(task) {

                    return task.id === id;

                });


            if (!task) {
                return;
            }


            taskInput.value =
                task.text;

            taskInput.focus();

            editingTaskId =
                id;


            document.querySelector(
                ".add-btn"
            ).textContent =
                "Update Task";

        }


        /* =========================================
           DELETE TASK
        ========================================== */

        function deleteTask(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this task?"
                );


            if (!confirmed) {
                return;
            }


            tasks =
                tasks.filter(function(task) {

                    return task.id !== id;

                });


            saveTasks();

            renderTasks();

        }


        /* =========================================
           FILTER TASKS
        ========================================== */

        filterButtons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        filterButtons.forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                        button.classList.add(
                            "active"
                        );


                        currentFilter =
                            button.dataset.filter;


                        renderTasks();

                    }
                );

            }
        );


        /* =========================================
           UPDATE STATISTICS
        ========================================== */

        function updateStatistics() {

            const total =
                tasks.length;


            const completed =
                tasks.filter(function(task) {

                    return task.completed;

                }).length;


            const active =
                total - completed;


            totalTasks.textContent =
                "Total: " + total;


            completedTasks.textContent =
                "Completed: " + completed;


            activeTasks.textContent =
                "Active: " + active;


            headerCount.textContent =
                total +
                (total === 1 ? " Task" : " Tasks");

        }


        /* =========================================
           CURRENT YEAR
        ========================================== */

        year.textContent =
            new Date().getFullYear();


        /* =========================================
           INITIAL RENDER
        ========================================== */

        renderTasks();

    </script>

</body>
</html>
